<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 502 502" width="502" height="502">
  <defs>
    <!-- Dark thin outline style matching the hand-drawn border effect -->
    <style>
      .lime-shape {
        fill: #99EE00;
        stroke: #222222;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Left Bracket -->
  <path class="lime-shape" d="
    M 212,50
    L 70,50
    L 70,452
    L 212,452
    L 212,382
    L 130,382
    L 130,120
    L 212,120
    Z" />

  <!-- Right Bracket -->
  <path class="lime-shape" d="
    M 290,50
    L 432,50
    L 432,452
    L 290,452
    L 290,382
    L 372,382
    L 372,120
    L 290,120
    Z" />

  <!-- Horizontal Dash / Minus Symbol -->
  <rect class="lime-shape" x="146" y="235" width="64" height="32" rx="3" ry="3" />

  <!-- Three Dots / Ellipsis -->
  <circle class="lime-shape" cx="258" cy="251" r="16" />
  <circle class="lime-shape" cx="308" cy="251" r="16" />
  <circle class="lime-shape" cx="358" cy="251" r="16" />
</svg>